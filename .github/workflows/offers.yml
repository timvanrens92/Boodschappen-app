name: Aanbiedingen ophalen

on:
  schedule:
    # elke woensdag 05:17 UTC (06:17 in de winter, 07:17 in de zomer)
    - cron: '17 5 * * 3'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/offers.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: node scripts/fetch-offers.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Paginatekst bewaren (voor als het herkennen misgaat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paginatekst
          path: debug-*.txt
          if-no-files-found: ignore
          retention-days: 14
